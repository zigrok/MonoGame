name: Build

on: [push, pull_request]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DotnetVersion: 10.0.103
  XCodeVersion: 26.2
  
jobs:
  build:
    name: build-${{ matrix.platform }}
    # TRACE_CI_RUNNERS picks GitHub-hosted runners (unset) or the local fleet (`self-hosted`); see
    # docs/self-hosted-runners.md in Trace Arena. Under the flag only the legs the local fleet can host exist:
    # there is no Windows machine, and the arm64 Linux pool is a 1.5 GB container that cannot build the native
    # runtime. Hosted CI keeps all four legs.
    runs-on: ${{ vars.TRACE_CI_RUNNERS == 'self-hosted' && (matrix.platform == 'macos' && fromJSON('["self-hosted","macOS","ARM64"]') || fromJSON('["self-hosted","Linux","X64","yiazmat-linux-x64-native"]')) || (matrix.platform == 'windows' && 'windows-latest' || matrix.platform == 'macos' && 'macos-latest' || matrix.platform == 'linux-arm' && 'ubuntu-24.04-arm' || 'ubuntu-latest') }}
    env:
      MONOGAME_WINDOWS_PLATFORM_TOOLSET: ${{ matrix.platform == 'windows' && 'v145' || '' }}
    strategy:
      matrix:
        platform: ${{ fromJSON(vars.TRACE_CI_RUNNERS == 'self-hosted' && '["macos","linux"]' || '["windows","macos","linux","linux-arm"]') }}
      fail-fast: false
    defaults:
      run:
        shell: ${{ matrix.platform == 'windows' && 'pwsh' || 'bash' }}
    steps:
      - name: Free disk space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: false 
          docker-images: true
          large-packages: ${{ runner.arch != 'ARM64' }}
          swap-storage: true

      - name: Clone repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Generate global.json
        run: |
          echo '{ "sdk": { "version": "${{ env.DotnetVersion }}" } }' > global.json
          echo "runner.arch=${{ runner.arch }}"

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '${{ env.DotnetVersion }}'
          global-json-file: "./global.json"
          
      - name: Setup Java
        if: runner.arch != 'ARM64'
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup Android SDK dependencies
        # The Android/iOS builds are skipped when the workload is absent (BuildAndroidTask/BuildiOSTask.ShouldRun),
        # which is the case on the local runners; the SDK bootstrap only makes sense on the hosted images.
        if: runner.environment == 'github-hosted' && runner.os != 'Windows' && runner.arch != 'ARM64'
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "emulator" \
            "system-images;android-34;default;x86_64"
          for i in {1..10}; do
            echo y
          done | "$sdkmanager" --licenses
        shell: bash

      - name: Setup Android SDK dependencies
        if: runner.environment == 'github-hosted' && runner.os == 'Windows'
        run: |
          $sdkManager = Join-Path $env:ANDROID_HOME "cmdline-tools/latest/bin/sdkmanager.bat"
          $packages = @(
            "platforms;android-34"
            "platforms;android-35"
            "platform-tools"
            "build-tools;34.0.0"
            "emulator"
            "system-images;android-34;default;x86_64"
          )
          & $sdkManager $packages
          1..10 | ForEach-Object { "y" } | & $sdkManager --licenses
        shell: pwsh

      - name: Setup DotNet on Windows
        if: runner.environment == 'github-hosted' && runner.os == 'windows'
        run: |
          dotnet workload install android ios --version ${{ env.DotnetVersion }}

      - name: Setup DotNet on linux
        if: runner.environment == 'github-hosted' && runner.os == 'Linux' && runner.arch == 'x64'
        run: |
          dotnet workload install android --version ${{ env.DotnetVersion }}

      - name: Update Homebrew
        if: runner.environment == 'github-hosted' && runner.os == 'macos'
        run: |
          brew update

      - name: Setup DotNet on MacOS
        if: runner.environment == 'github-hosted' && runner.os == 'macos'
        run: |
          dotnet workload install macos ios --version ${{ env.DotnetVersion }}

      - name: Pin xcode version
        uses: maxim-lobanov/setup-xcode@v1
        if: runner.environment == 'github-hosted' && runner.os == 'macos'
        with:
          xcode-version: '${{ env.XCodeVersion }}'

      - name: Add msbuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Setup Premake5
        uses: abel0b/setup-premake@de7d79047789622064f7a2d251e929fadd166707
        if: runner.os != 'Linux' || runner.arch != 'ARM64'
        with:
          version: "5.0.0-beta2"
      - name: Build Premake5
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends uuid-dev
          git clone https://github.com/premake/premake-core.git ${GITHUB_WORKSPACE}/premake-core
          cd ${GITHUB_WORKSPACE}/premake-core
          ./Bootstrap.sh
          echo "${GITHUB_WORKSPACE}/premake-core/bin/release" >> "$GITHUB_PATH"

      - name: Install Vulkan SDK
        uses: zigrok/setup-vulkan-sdk@45c0d9fd5d600244dfa293b3a8c008f5fdd8a0dd
        if: runner.os != 'macos'
        with:
          vulkan-query-version: 1.4.309.0
          vulkan-use-cache: true
          vulkan-components: 'Vulkan-Headers, Vulkan-Loader'

      - name: Install Full Vulkan SDK
        if: runner.os == 'macos'
        uses: zigrok/install-vulkan-sdk@52e46193a1752c2d315469bfb08c45f09d932f61
        with:
          version: 1.4.309.0
          cache: true

      - name: Disable Annotations
        run: echo "::remove-matcher owner=csc::"

      - name: Setup Wine
        uses: monogame/monogame-actions/install-wine@v1.0.3

      - name: Install Fonts
        uses: monogame/monogame-actions/install-fonts@v1
        
      - name: Install SDL3 deps on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev libaudio-dev libjack-jackd2-dev libsndio-dev libsamplerate0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev \
            libpipewire-0.3-dev libdecor-0-dev

      - name: Dotnet Restore Templates
        if: runner.environment == 'github-hosted' && runner.os == 'Windows'
        run: |
          dotnet restore Templates/MonoGame.Templates.VSExtension

      - name: Build
        if: runner.os != 'Linux' || runner.arch != 'ARM64'
        run: |
          dotnet run --project build/Build.csproj -- --target=Default
        env:
          DOTNET_SYSTEM_NET_SECURITY_NOREVOCATIONCHECKBYDEFAULT: 1 # android compilation is failing randomly due to downloads from microsofts website during it

      - name: Build
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          dotnet run --project build/Build.csproj -- --target="Build Shaders"
          dotnet run --project build/Build.csproj -- --target="Build Native"
          dotnet run --project build/Build.csproj -- --target="Build Content Pipeline"
        env:
          DOTNET_SYSTEM_NET_SECURITY_NOREVOCATIONCHECKBYDEFAULT: 1 # android compilation is failing randomly due to downloads from microsofts website during it
          
      - name: Run Tools Tests
        if: runner.os != 'Linux' || runner.arch != 'ARM64'
        run: |
          # $HOME, not the hosted runner's fixed home, so the same step works on the local macOS/Linux runners.
          if [ "$RUNNER_OS" == "Windows" ]; then
                dotnet test Tools/MonoGame.Tools.Tests/MonoGame.Tools.Tests.csproj --blame-hang-timeout 5m -c Release
          else
                MGFXC_WINE_PATH="$HOME/.winemonogame" dotnet test Tools/MonoGame.Tools.Tests/MonoGame.Tools.Tests.csproj --blame-hang-timeout 5m -c Release --filter="TestCategory!=Audio"
          fi
        env:
          CI: true
        shell: bash

      - name: Validate shader production contracts
        if: runner.os != 'Linux' || runner.arch != 'ARM64'
        run: |
          dotnet test Tools/MonoGame.Tools.Tests/MonoGame.Tools.Tests.csproj --no-build -c Release --filter="FullyQualifiedName~EffectCompilerCacheTests|FullyQualifiedName~EffectVariantStripperTests|FullyQualifiedName~ShaderPipelineContractTests"
          dotnet build Tools/MonoGame.ShaderPipeline.Benchmark/MonoGame.ShaderPipeline.Benchmark.csproj -c Release
          python3 -m unittest scripts/tests/test_check_shader_pipeline_regression.py
        env:
          CI: true
        shell: bash

      - name: Ensure macOS workloads
        if: runner.environment == 'github-hosted' && runner.os == 'macos'
        run: |
          dotnet workload install macos ios --version ${{ env.DotnetVersion }}

      - name: Test generated Nuget packages
        if: runner.os != 'Linux'
        run: dotnet run --project build/Build.csproj -- --target=TestNuGet --framework net9.0
        env:
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          ACTIONS_RUNTIME_URL: "${{ env.ACTIONS_RUNTIME_URL }}"           

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Upload Artifacts
        run: dotnet run --project build/Build.csproj -- --target=UploadArtifacts
        env:
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          ACTIONS_RUNTIME_URL: "${{ env.ACTIONS_RUNTIME_URL }}"

  pack-native-runtime:
    name: PackNativeRuntime
    needs: [ build ]
    # Packs the runtime NuGets from the native binaries of *all* build legs, including the Windows ones. Under
    # TRACE_CI_RUNNERS=self-hosted the Windows leg does not exist, so packaging is skipped; hosted CI still packs.
    if: vars.TRACE_CI_RUNNERS != 'self-hosted'
    runs-on: ${{ vars.TRACE_CI_RUNNERS == 'self-hosted' && fromJSON('["self-hosted","Linux","X64","yiazmat-linux-x64-native"]') || 'ubuntu-latest' }}
    permissions:
        packages: write
        contents: write
    steps:
        - name: Clone Repository
          uses: actions/checkout@v7
          with:
            submodules: recursive

        - name: Generate global.json
          run: |
            echo '{ "sdk": { "version": "${{ env.DotnetVersion }}" } }' > global.json

        - name: Setup .NET Core SDK
          uses: actions/setup-dotnet@v6
          with:
            dotnet-version: '${{ env.DotnetVersion }}'
            global-json-file: "./global.json"

        - name: Expose GitHub Runtime
          uses: crazy-max/ghaction-github-runtime@v4

        - name: Pack Native Runtime
          run: dotnet run --project build/Build.csproj -- --target="Pack Native Runtime"
          env:
            ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
            ACTIONS_RUNTIME_URL: "${{ env.ACTIONS_RUNTIME_URL }}"

  package-binaries:
    name: PackageBinaries
    needs: [ build, pack-native-runtime, tests ]
    if: vars.TRACE_CI_RUNNERS != 'self-hosted'
    runs-on: ${{ vars.TRACE_CI_RUNNERS == 'self-hosted' && fromJSON('["self-hosted","Linux","X64","yiazmat-linux-x64-native"]') || 'ubuntu-latest' }}
    permissions:
        packages: write
        contents: write
    steps:
        - name: Clone Repository
          uses: actions/checkout@v7
          with:
            submodules: recursive

        - name: Generate global.json
          run: |
            echo '{ "sdk": { "version": "${{ env.DotnetVersion }}" } }' > global.json

        - name: Setup .NET Core SDK
          uses: actions/setup-dotnet@v6
          with:
            dotnet-version: '${{ env.DotnetVersion }}'

        - name: Expose GitHub Runtime
          uses: crazy-max/ghaction-github-runtime@v4

        - name: Upload Binaries package
          run: dotnet run --project build/Build.csproj -- --target=DeployBinaries
          env:
            ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
            ACTIONS_RUNTIME_URL: "${{ env.ACTIONS_RUNTIME_URL }}"

  deploy:
    name: Deploy
    needs: [ build, pack-native-runtime, tests ]
    # `needs` already holds the release path back when pack-native-runtime is skipped; the explicit condition keeps the
    # intent readable (the fork never publishes from the local fleet).
    if: ${{ github.event_name == 'push' && vars.TRACE_CI_RUNNERS != 'self-hosted' }}
    runs-on: ${{ vars.TRACE_CI_RUNNERS == 'self-hosted' && fromJSON('["self-hosted","Linux","X64","yiazmat-linux-x64-native"]') || 'ubuntu-latest' }}
    permissions:
        packages: write
        contents: write
    steps:
        - name: Clone Repository
          uses: actions/checkout@v7
          with:
            submodules: recursive

        - name: Generate global.json
          run: |
            echo '{ "sdk": { "version": "${{ env.DotnetVersion }}" } }' > global.json

        - name: Setup .NET Core SDK
          uses: actions/setup-dotnet@v6
          with:
            dotnet-version: '${{ env.DotnetVersion }}'
            global-json-file: "./global.json"

        - name: Expose GitHub Runtime
          uses: crazy-max/ghaction-github-runtime@v4

        - name: Push Nugets
          run: dotnet run --project build/Build.csproj -- --target=Deploy
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
            MARKETPLACE_PAT: ${{ secrets.MARKETPLACE_PAT }}

        - name: Make a Release
          if: github.ref_type == 'tag'
          uses: ncipollo/release-action@v1
          with:
            name: 'MonoGame ${{ github.ref_name }}'
            tag: ${{ github.ref_name }}
            allowUpdates: true
            removeArtifacts: true
            artifacts: "nugets/*.nupkg;vsix/MonoGame.Templates.VSExtension.vsix"
            token: ${{ secrets.GITHUB_TOKEN }}

  choose-runner:
    runs-on: ${{ vars.TRACE_CI_RUNNERS == 'self-hosted' && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    outputs:
      runner: ${{ steps.runner.outputs.runner }}

    steps:
    - id: runner
      run: |
        if [ "${{ github.repository }}" == "MonoGame/MonoGame" ]; then
          echo "runner=-selfhosted-" >> "$GITHUB_OUTPUT"
        else
          echo "runner=-" >> "$GITHUB_OUTPUT"
        fi

  tests:
    name: tests-${{ matrix.platform }}
    # pack-native-runtime is not a dependency: the tests only consume the test artifacts the build leg uploads.
    # Keeping it in `needs` would skip the tests under TRACE_CI_RUNNERS=self-hosted, where packaging is skipped.
    needs: [ build, choose-runner ]
    runs-on: ${{ vars.TRACE_CI_RUNNERS == 'self-hosted' && (matrix.platform == 'macos' && fromJSON('["self-hosted","macOS","ARM64"]') || fromJSON('["self-hosted","Linux","X64","yiazmat-linux-x64-native"]')) || (matrix.platform == 'windows' && format('windows{0}latest', needs.choose-runner.outputs.runner) || matrix.platform == 'macos' && format('macos{0}latest', needs.choose-runner.outputs.runner) || matrix.platform == 'linux-arm' && 'ubuntu-24.04-arm' || 'ubuntu-latest') }}
    env:
      # The Framework pass skips Audio on Linux because the audio suite runs in its own step there.
      MATRIX_FILTER: ${{ matrix.platform == 'linux' && '--where="Category != Audio"' || '' }}
    strategy:
      matrix:
        platform: ${{ fromJSON(vars.TRACE_CI_RUNNERS == 'self-hosted' && '["macos","linux"]' || '["windows","macos","linux","linux-arm"]') }}
      fail-fast: false
    defaults:
      run:
        shell: ${{ matrix.platform == 'windows' && 'pwsh' || 'bash' }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Free disk space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: false 
          docker-images: true
          large-packages: true
          swap-storage: true

      - name: Generate global.json
        run: |
          echo '{ "sdk": { "version": "${{ env.DotnetVersion }}", "workloadVersion": "${{ env.DotnetVersion }}" } }' > global.json

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '${{ env.DotnetVersion }}'
          global-json-file: "./global.json"

      - name: Install Linux test dependencies
        # The local runner image is a plain .NET container: it has none of the SDL/X11/GL/Vulkan runtime libraries or
        # the virtual display the DesktopGL and Vulkan artifacts need. The hosted image already ships them.
        if: vars.TRACE_CI_RUNNERS == 'self-hosted' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 libgles2 \
            mesa-vulkan-drivers libvulkan1 \
            xvfb xauth \
            libasound2t64 libpulse0 libdbus-1-3 libudev1 \
            libx11-6 libxext6 libxrandr2 libxcursor1 libxfixes3 libxi6 libxss1 libxtst6 \
            libwayland-client0 libxkbcommon0 libdrm2 libgbm1

      - name: Start the virtual display
        if: vars.TRACE_CI_RUNNERS == 'self-hosted' && runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1280x720x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          # No GPU in the container: DesktopGL draws through Mesa llvmpipe and Vulkan through lavapipe.
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"

      - name: Install Linux Native smoke dependencies
        if: runner.environment == 'github-hosted' && matrix.platform == 'linux' && runner.arch == 'X64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb xauth

      - name: Update Homebrew
        if: runner.environment == 'github-hosted' && runner.os == 'macos'
        run: |
          brew update

      - name: Check Vulkan
        if: runner.environment != 'github-hosted' && runner.os == 'macos'
        run: |
          echo "VULKAN_SDK: $VULKAN_SDK"
          echo "VK_ICD_FILENAMES: $VK_ICD_FILENAMES"
          which vulkaninfo
          vulkaninfo --summary
          ls -l /usr/local/lib/libvulkan.1.dylib
          file /usr/local/lib/libvulkan.1.dylib
          echo $DYLD_LIBRARY_PATH

      - name: Disable Annotations
        run: echo "::remove-matcher owner=csc::"

      - name: Setup Wine
        if: runner.environment == 'github-hosted'
        uses: monogame/monogame-actions/install-wine@v1.0.3

      - name: Install Fonts
        uses: monogame/monogame-actions/install-fonts@v1

      - name: Pin xcode version
        uses: maxim-lobanov/setup-xcode@v1
        if: runner.environment == 'github-hosted' && runner.os == 'macos'
        with:
          xcode-version: '${{ env.XCodeVersion }}'

      - name: Download tests-desktopgl-${{ matrix.platform }}
        uses: actions/download-artifact@v8
        with:
          name: tests-desktopgl-${{ matrix.platform }}
          path: tests-desktopgl
          
      - name: Download tests-windowsdx-${{ matrix.platform }}
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: tests-windowsdx-${{ matrix.platform }}
          path: tests-windowsdx
          
      - name: Download tests-windowsdx12-${{ matrix.platform }}
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: tests-windowsdx12-${{ matrix.platform }}
          path: tests-windowsdx12

      - name: Download tests-desktopvk-${{ matrix.platform }}
        uses: actions/download-artifact@v8
        with:
          name: tests-desktopvk-${{ matrix.platform }}
          path: tests-desktopvk

      - name: Download tests-desktopmetal-${{ matrix.platform }}
        if: runner.os == 'macos'
        uses: actions/download-artifact@v8
        with:
          name: tests-desktopmetal-${{ matrix.platform }}
          path: tests-desktopmetal

      - name: Run hosted Windows DX12 SDL3 smoke tests
        if: runner.environment == 'github-hosted' && runner.os == 'Windows'
        run: dotnet MonoGame.Tests.dll --where="cat == NativeSdl3" --timeout=60000 --labels=Before
        env:
          CI: true
        working-directory: tests-windowsdx12

      - name: Run hosted macOS Vulkan SDL3 smoke tests
        if: runner.environment == 'github-hosted' && runner.os == 'macos'
        run: dotnet MonoGame.Tests.dll --where="cat == NativeSdl3" --timeout=60000 --labels=Before
        env:
          CI: true
        working-directory: tests-desktopvk

      - name: Run hosted macOS Metal SDL3 smoke tests
        if: runner.environment == 'github-hosted' && runner.os == 'macos'
        run: dotnet MonoGame.Tests.dll --where="cat == NativeSdl3" --timeout=60000 --labels=Before
        env:
          CI: true
          MG_METAL_VALIDATE_DRAWABLE_SIZE: 1
        working-directory: tests-desktopmetal

      - name: Run hosted Linux Vulkan SDL3 smoke tests
        if: runner.environment == 'github-hosted' && matrix.platform == 'linux' && runner.arch == 'X64'
        run: xvfb-run -a -s "-screen 0 1280x720x24" dotnet MonoGame.Tests.dll --where="cat == NativeSdl3 && cat != Fullscreen" --timeout=60000 --labels=Before
        env:
          CI: true
          SDL_VIDEODRIVER: x11
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        working-directory: tests-desktopvk

      # Run the DirectX 11 tests in two steps: first the audio, then the rest.
      # This is because the audio tests has some incompatibilities within the runner with ContentManagerTests.
      - name: Run DirectX 11 Audio Tests
        if: runner.os == 'Windows' && runner.environment != 'github-hosted'
        run: dotnet test --filter Category=Audio MonoGame.Tests.dll
        env:
          CI: true
        working-directory: tests-windowsdx
        
      - name: Run DirectX 11 All Tests Except Audio
        if: runner.os == 'Windows' && runner.environment != 'github-hosted'
        run: dotnet test --filter Category!=Audio MonoGame.Tests.dll
        env:
          CI: true
        working-directory: tests-windowsdx
        
      # Run DirectX 12 tests in separate groups.
      - name: Run DirectX 12 Audio Tests
        if: runner.os == 'Windows' && runner.environment != 'github-hosted'
        run: dotnet MonoGame.Tests.dll --where="Category == Audio || Category == Song" --timeout=300000
        env:
          CI: true
        working-directory: tests-windowsdx12
        
      - name: Run DirectX 12 GraphicsDevice Tests
        if: runner.os == 'Windows' && runner.environment != 'github-hosted'
        run: dotnet MonoGame.Tests.dll --where="Category == GraphicsDevice" --timeout=300000
        env:
          CI: true
        working-directory: tests-windowsdx12
        
      - name: Run DirectX 12 MemoryLifeCycle Tests
        if: runner.os == 'Windows' && runner.environment != 'github-hosted'
        run: dotnet MonoGame.Tests.dll --where="Category == MemoryLifeCycle" --timeout=300000
        env:
          CI: true
        working-directory: tests-windowsdx12
        
      - name: Run DirectX 12 All Tests Except Audio, GraphicsDevice, MemoryLifeCycle
        if: runner.os == 'Windows' && runner.environment != 'github-hosted'
        run: dotnet MonoGame.Tests.dll --where="Category != Audio && Category != Song && Category != GraphicsDevice && Category != MemoryLifeCycle" --timeout=600000
        env:
          CI: true
        working-directory: tests-windowsdx12

      # Run Vulkan tests in separate groups.
      - name: Run Vulkan Audio Tests
        if: runner.environment != 'github-hosted'
        run: dotnet MonoGame.Tests.dll --where="Category == Audio || Category == Song" --timeout=300000 --labels=Before
        env:
          CI: true
        working-directory: tests-desktopvk
        
      - name: Run Vulkan GraphicsDevice Tests
        if: runner.environment != 'github-hosted'
        run: dotnet MonoGame.Tests.dll --where="Category == GraphicsDevice" --timeout=300000 --labels=Before
        env:
          CI: true
          #VK_LOADER_DEBUG: all 
        working-directory: tests-desktopvk
        
      - name: Run Vulkan MemoryLifeCycle Tests
        if: runner.environment != 'github-hosted'
        run: dotnet MonoGame.Tests.dll --where="Category == MemoryLifeCycle" --timeout=300000 --labels=Before
        env:
          CI: true
          #VK_LOADER_DEBUG: all 
        working-directory: tests-desktopvk
        
